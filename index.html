<style>
  :root{
    --ink:#16211B;
    --ink-soft:#33443A;
    --paper:#EDEAE0;
    --paper-2:#DFDACA;
    --amber:#C08A2E;
    --amber-ink:#7E5510;
    --rust:#7E3F26;
    --rust-ink:#7E3F26;
    --line:rgba(22,33,27,.3);
    --radius:18px;
    --shadow:0 12px 30px rgba(28,42,34,.22);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme:light dark;
  }
  *,*::before,*::after{box-sizing:inherit}
  html{height:100%;-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0;min-height:100%;
    background:var(--paper);
    color:var(--ink);
    font:16px/1.5 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    display:flex;flex-direction:column;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ink:#EDEADC;--ink-soft:#C6CDC2;--paper:#121A15;--paper-2:#1F2B23;
      --amber-ink:#EBCB80;--rust:#9A4A2A;--rust-ink:#EFA982;
      --line:rgba(237,234,220,.32);--shadow:0 12px 30px rgba(0,0,0,.5);
    }
  }
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:6px}

  header{
    padding:14px 18px 10px;display:flex;align-items:baseline;gap:10px;
    border-bottom:1px solid var(--line);
  }
  .wordmark{font-size:22px;font-weight:600;letter-spacing:.02em;margin:0}
  .wordmark span{color:var(--amber-ink)}
  .tally{margin-left:auto;font:13px/1.4 ui-sans-serif,system-ui,sans-serif;color:var(--ink-soft);font-variant-numeric:tabular-nums}

  .filters{
    display:flex;gap:6px;padding:10px 18px;overflow-x:auto;scrollbar-width:none;
    border-bottom:1px solid var(--line);
  }
  .filters::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:transparent;
    border-radius:999px;padding:6px 13px;font-size:14px;white-space:nowrap;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  main{flex:1;display:flex;flex-direction:column;padding:16px 16px 0;min-height:0}

  .stage{perspective:1400px;flex:1;min-height:340px;display:flex}
  .card{
    position:relative;flex:1;transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,.7,.3,1);
  }
  .card.flipped{transform:rotateY(180deg)}
  @media (prefers-reduced-motion:reduce){.card{transition:none}}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:22px 20px;display:flex;flex-direction:column;overflow:auto;
  }
  .face.front{background:var(--paper-2);color:var(--ink);border:1px solid var(--line)}
  .face.back{background:var(--paper-2);color:var(--ink);transform:rotateY(180deg);border:1px solid var(--line)}

  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:auto}
  .tag{
    font:500 12px/1 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:5px 9px;border-radius:999px;border:1px solid var(--line);
    color:var(--ink);
  }
  .tag.where{background:var(--amber);color:#16211B;border-color:transparent}
  .tag.extra{background:var(--rust);color:#FBF5EC;border-color:transparent}

  .title{font-size:clamp(28px,7.5vw,40px);line-height:1.1;margin:22px 0 10px;font-weight:600}
  .hint{font:14px/1.45 ui-sans-serif,system-ui,sans-serif;color:var(--ink-soft);margin-top:14px}
  .back h2{font-size:20px;margin:14px 0 8px;font-weight:600}
  .task{margin:0 0 14px;font-size:17px;line-height:1.55;max-width:60ch;color:var(--ink)}
  .tips{margin:0;padding-left:18px;font-size:16px;line-height:1.5;color:var(--ink)}
  .tips li{margin-bottom:8px;max-width:60ch}
  .tips li::marker{color:var(--amber-ink)}
  .src{
    margin-top:16px;padding-top:10px;border-top:1px solid var(--line);
    font:13px/1.55 ui-sans-serif,system-ui,sans-serif;color:var(--ink-soft);
  }
  .checkme{color:var(--rust-ink);font-weight:600}

  .bar{
    display:flex;gap:8px;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));
  }
  .bar button{
    flex:1;padding:14px 10px;border-radius:14px;border:1px solid var(--line);
    background:transparent;font:500 15px/1 ui-sans-serif,system-ui,sans-serif;
  }
  .bar button.primary{background:var(--amber);border-color:transparent;color:#16211B;font-weight:600;flex:1.4}

  .list{display:none;padding:4px 0 24px}
  .list.on{display:block}
  .stage.off,.bar.off{display:none}
  .row{
    width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);
    padding:12px 2px;display:flex;gap:10px;align-items:baseline;
  }
  .row b{font-weight:600;font-size:16px}
  .row small{font:13px/1.4 ui-sans-serif,system-ui,sans-serif;color:var(--ink-soft)}
  .row .count{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--amber-ink);font-size:14px;font-weight:600}
  .group{margin:18px 0 4px;font:600 14px/1 ui-sans-serif,system-ui,sans-serif;color:var(--ink)}
  footer{padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));font:13px/1.5 ui-sans-serif,system-ui,sans-serif;color:var(--ink-soft)}
  footer button{background:none;border:0;padding:0;text-decoration:underline;font:inherit}
</style>
</head>
<body>

<header>
  <h1 class="wordmark">Cue<span>.</span></h1>
  <span class="tally" id="tally"></span>
</header>

<div class="filters" id="filters"></div>

<main>
  <div class="stage" id="stage">
    <div class="card" id="card">
      <div class="face front">
        <div class="meta" id="frontMeta"></div>
        <h2 class="title" id="frontTitle">Ready</h2>
        <p class="hint">Tap the card to see the exercise. Swipe for another.</p>
      </div>
      <div class="face back">
        <div class="meta" id="backMeta"></div>
        <h2 class="title" id="backTitle" style="font-size:22px;margin:12px 0 6px"></h2>
        <p class="task" id="task"></p>
        <h2 id="tipHead" hidden>Tips</h2>
        <ul class="tips" id="tips"></ul>
        <p class="src" id="src"></p>
      </div>
    </div>
  </div>

  <div class="bar" id="bar">
    <button id="skip">Skip</button>
    <button id="flip" class="primary">Flip</button>
    <button id="done">Done</button>
  </div>

  <div class="list" id="list"></div>
</main>

<footer>
  <span id="foot"></span>
  <button id="reset">Reset counts</button>
</footer>

<script>
/* ---------- deck -------------------------------------------------------- */
/* src: where the card came from.  check:true means the wording here is a
   standard method, not Rachel's - confirm against the club handout named. */
const DECK = [
 {t:"Sit with distractions",c:"Attention",w:"At home",s:"MDDTC · week 1",
  task:"Ask for a sit, then add movement: march on the spot, wave your arms in the air, and build up to turning a complete circle in front of him while he stays sitting.",
  tips:["Add one distraction at a time. If he breaks, go back a step rather than repeating the cue.","Reward while he is still sitting, not after he has got up."]},

 {t:"The down",c:"Manners",w:"At home",s:"MDDTC · week 1",
  task:"Practise downs in a different session from your sit work.",
  tips:["Keeping sits and downs apart early on stops him guessing between the two.","Little and often beats one long session."]},

 {t:"Kissy kissy game",c:"Attention",w:"At home",s:"MDDTC · week 1",check:"Covered in the hall — the email is only a reminder, so fill this one in from your class notes.",
  task:"Week 1 class game. The email lists it as homework but doesn't set out the method.",
  tips:["Ask Rachel, or check your week 1 notes, then edit this card in the file."]},

 {t:"Something to do while waiting",c:"Life skills",w:"Anywhere",s:"MDDTC · week 1",
  task:"Take a stuffed Kong, lick mat, antler or chew so he has something to settle with while he isn't working.",
  tips:["Freeze a stuffed Kong to make it last a whole class.","A pup lying down with a chew is still learning — that is the settle."]},

 {t:"Rewards on you, fast",c:"Life skills",w:"Anywhere",s:"MDDTC · week 1",
  task:"Take plenty of rewards and vary them so you can ring the changes. Wear a bumbag, pouch, or a jacket whose pockets you don't mind smelling, so treats come out quickly.",
  tips:["A slow reward marks the wrong moment — aim to deliver within a second of the click.","Keep the best food for the hardest work."]},

 {t:"Paw wiping",c:"Handling",w:"At home",s:"MDDTC · week 2",
  task:"Wipe his paws with a towel while you watch television. Everything can be turned into a training session.",
  tips:["One paw, one treat, then stop. Build up from there.","Being consistent speeds up his understanding of what is expected."]},

 {t:"Sit for everything",c:"Manners",w:"At home",s:"MDDTC · week 2",
  task:"Make him sit for his food, for the lead going on, for the lead coming off, for doors.",
  tips:["If you don't expect it every time, he won't offer it every time.","Once it becomes automatic, it has landed."]},

 {t:"Loose lead walking indoors",c:"Lead",w:"At home",s:"MDDTC · week 2",
  task:"Get loose lead walking right before you take it outside: up and down the hall, round and round the kitchen, and in the back garden.",
  tips:["Handouts: 'Loose Lead Walking (first steps)' and 'LLW step 2'.","Quiet, familiar rooms first — the pavement is the exam, not the lesson."]},

 {t:"Walks as training",c:"Lead",w:"Out and about",s:"MDDTC · week 2",
  task:"When you take him out, don't think about going for a walk — think training. Ten or fifteen minutes of concentration tires him more than twenty minutes of dragging you around.",
  tips:["Several short outings a day beat one long one.","Time consuming, but it is the part that pays back."]},

 {t:"Sit at your side",c:"Manners",w:"Anywhere",s:"MDDTC · week 2",
  task:"Teach him to sit by your left leg and by your right leg, as if you were about to cross the road. Sit means put your bottom on the floor, wherever he is.",
  tips:["Most pups are happy to sit in front of you and much less sure at the side.","Do each side as its own exercise."]},

 {t:"Sit while you look away",c:"Attention",w:"Anywhere",s:"MDDTC · week 2",
  task:"With him sitting at your side, break eye contact for a few seconds. The goal is six seconds of sit while you look away for three.",
  tips:["Click before you reach for the reward.","Build the look-away a second at a time."]},

 {t:"Hand touch",c:"Attention",w:"At home",s:"MDDTC · week 2",check:"Standard method — check the club's 'Hand Touch' handout for Rachel's steps.",
  task:"Hold a flat hand a few inches from his nose. The instant his nose touches it, click and reward. Move your hand to a new spot and repeat.",
  tips:["Once it is solid it moves him around without any lead pressure.","A good emergency recall for the last few feet."]},

 {t:"Recall practice",c:"Recall",w:"Out and about",s:"MDDTC · week 3",check:"Standard method — the club's 'Recall' handout has the full version.",
  task:"Call him back, pay him well, release him again. He doesn't need lots of off-lead exercise at this age — just enough to practise coming back.",
  tips:["Never call him to do something he dislikes.","Pay every recall while he is young. This is the one to over-reward."]},

 {t:"The set-up procedure",c:"Recall",w:"Out and about",s:"MDDTC · week 3",
  task:"Sit = feed. Lead off with him still sitting = feed. Sometimes lead back on = feed. Sometimes tell him to go and play.",
  tips:["Mixing what comes next stops him predicting that lead-off always means freedom.","Ask about long lines — Rachel covers their benefits in class."]},

 {t:"This way",c:"Lead",w:"Anywhere",s:"MDDTC · week 3",check:"Method covered in the hall — fill in from your notes.",
  task:"Keep practising 'this way' — it gets used in class when the pups say hello to each other.",
  tips:["The point is turning him away from something without hauling on the lead."]},

 {t:"Two-toy tuggy",c:"Games",w:"At home",s:"MDDTC · week 3",
  task:"Two identical toys, something you and he can both hold. Play tuggy with one, then bring the second to life so he swaps onto it.",
  tips:["Two of the same means the one in your hand is always the interesting one.","Restarting the game is the reward for letting go."]},

 {t:"Catch the offered behaviour",c:"Attention",w:"At home",s:"MDDTC · week 3",
  task:"He should be starting to offer what he's learned is rewarding without being asked — sitting before food, sitting before going outside, and best of all, offering eye contact. Pay it when he does.",
  tips:["If it isn't happening yet, stay calm and consistent rather than adding more cues."]},

 {t:"The swapping game",c:"Games",w:"At home",s:"MDDTC · week 4",
  task:"Encourage him to bring you anything he has in his mouth. If you can't get him to drop it, swap it for another toy or a piece of food.",
  tips:["Handout: 'Swapping Game'.","Never chase. Chasing teaches him that holding things makes you play."]},

 {t:"The watch",c:"Attention",w:"Anywhere",s:"MDDTC · week 4",check:"Duration work is from the email; the handout 'the watch part 1' has the build-up.",
  task:"Build up the length of time he will hold strong eye contact with you.",
  tips:["Add a second at a time and pay before he looks away.","Easy at home first, then with something mildly distracting nearby."]},

 {t:"Stay, first steps",c:"Manners",w:"At home",s:"MDDTC · week 4",
  task:"Put him in a sit with rewards on the worktop. Stand at his side as if crossing the road, stretch out and pick up one piece of food. If he stays sitting, he gets it. If he gets up, the food goes back and you ask for the sit again.",
  tips:["Say nothing when he gets up — just reset. The food going back is the information.","This is the groundwork for 'leave' too."]},

 {t:"The leave",c:"Manners",w:"At home",s:"MDDTC · week 5",check:"Standard method — the club's 'the leave' handout is the one to follow.",
  task:"Food in a closed fist held still. The second he stops trying to get at it — backs off, looks away, looks at you — mark it and pay him from your other hand.",
  tips:["He is never rewarded from the hand he was working on.","Only add the word once he is reliably backing off."]},

 {t:"The settle",c:"Life skills",w:"At home",s:"MDDTC · week 5",check:"Standard method — the club's 'The Settle' handout is the one to follow.",
  task:"On a mat or bed beside you, reward him quietly for lying down and staying there. Drop treats between his paws while he is settled rather than calling him up for them.",
  tips:["Reward the calm, not the arrival. Pay him while he is lying still.","Build up from a minute at a time with something to chew."]},

 {t:"Bring me your treasure",c:"Games",w:"Anywhere",s:"MDDTC · week 5",
  task:"When he picks up something he shouldn't have, encourage him to you — never chase. When he comes, stroke him and make a fuss. Don't grab at whatever is in his mouth or he will stop sharing.",
  tips:["Puppies will always pick things up. The aim is that he brings his treasures to show you.","Make it so good to bring things over that running off down the garden never occurs to him."]},

 {t:"Getting used to the kit",c:"Lead",w:"At home",s:"MDDTC · week 5",
  task:"Before walking in a headcollar or harness, put it on, give treats, take it off again. Build up the time he will wear it.",
  tips:["Rachel's preferred headcollar is a Gentle Leader — it doesn't ride up near the eyes, and if it comes off the nose it stays round the neck.","She uses Perfect Fit harnesses: fleece-edged, washable, three sections so any size combination fits. WARS at Deblins Green stock them and will fit one by appointment.","Harnesses stop collar choking but many dogs learn to pull into them — a front ring helps.","Skip this step and he will walk with his head on the ground trying to rub it off."]},

 {t:"Parvovirus watch",c:"Care",w:"Anywhere",s:"MDDTC · week 5",
  task:"There has been a case of parvovirus in the area. Know the symptoms so you would spot them quickly — it is life threatening and only prompt action gives a pup a chance.",
  tips:["Vomiting, bloody diarrhoea, lethargy, off food. Ring the vet straight away rather than waiting to see.","Keep away from spots where unknown dogs have toileted while it is about."]},

 {t:"Crate training",c:"Life skills",w:"At home",s:"MDDTC handout · week 1",check:"Standard method — the club's 'Crate Training' handout is the one to follow.",
  task:"Feed him in the crate with the door open, then start closing it for a few seconds at a time while he is eating or chewing. Let him out before he asks to come out.",
  tips:["The crate is a bedroom, never a punishment.","Work up to leaving the room for a moment, then longer."]},

 {t:"Food and Kongs",c:"Life skills",w:"At home",s:"MDDTC handout · week 1",check:"Standard method — see the club's 'Food and Kongs' handout.",
  task:"Put part of his daily food into Kongs, lick mats and scatter feeds rather than a bowl. Working for food is mentally tiring in a way a bowl isn't.",
  tips:["Take training treats out of the daily ration so he isn't overfed.","Start easy: loose food, wide opening. Frozen and packed comes later."]},

 {t:"Charging the clicker",c:"Attention",w:"At home",s:"MDDTC handout · week 1",check:"Standard method — see 'puppy clicker training'.",
  task:"Click, then treat, twenty or thirty times with nothing asked of him, so the sound comes to mean food is on its way.",
  tips:["The click marks the moment, the food pays for it. Always follow a click with food, even a mistaken one.","One click, not a volley."]},

 {t:"Timing and rate of reward",c:"Attention",w:"Anywhere",s:"MDDTC handout · week 1",check:"Standard method — see the 'Technical stuff!' handout.",
  task:"Mark the exact instant the behaviour happens, not a second later. Early on, keep the rate high — lots of small rewards rather than a few big ones.",
  tips:["If he is losing interest, your rate of reward is probably too low or the step too big.","Finish while he still wants more."]},

 {t:"Response to name",c:"Attention",w:"Anywhere",s:"MDDTC handout · week 1",check:"Standard method — see the 'Reponse To Name' handout.",
  task:"Say his name once. The moment his head turns, mark and pay. Never repeat it over and over, and never use it to tell him off.",
  tips:["Practise in easy places first, then somewhere more interesting.","His name means 'look at me', not 'come here' — that's a separate cue."]},

 {t:"Circuit training",c:"Manners",w:"Anywhere",s:"MDDTC handout · week 3",check:"Method from the club's 'CIRCUIT TRAINING' handout — check the detail.",
  task:"Run a short circuit of everything he knows — sit, down, hand touch, watch, a few steps of loose lead — a few reps each, then stop.",
  tips:["Mixing exercises keeps him guessing and builds fluency.","Five minutes is plenty."]},

 {t:"How much exercise",c:"Care",w:"Out and about",s:"MDDTC handout · week 3 + Kennel Club",
  task:"Keep formal exercise short while he is growing. The usual rule of thumb is five minutes per month of age, up to twice a day, until he is fully grown.",
  tips:["The Kennel Club and PDSA both give the five-minutes-per-month figure: 15 minutes at three months, 20 at four.","Free mooching and sniffing is not the same as forced-pace walking — it's the repetitive, fast stuff that needs limiting.","Sniffing is tiring. Ten minutes of nose work can do more than a mile."]},

 {t:"Play biting",c:"Handling",w:"At home",s:"MDDTC handout · week 2",check:"Standard method — the club's 'PLAY BITING' handout is the one to follow.",
  task:"When teeth touch skin, the game stops: stand up, hands away, no telling off. Restart a few seconds later, redirecting onto a toy.",
  tips:["Mouthing is normal and it passes. Consistency shortens it.","Most biting is worst when he is overtired — try a nap before you try training."]},

 {t:"Handling practice",c:"Handling",w:"At home",s:"MDDTC handout · week 2",check:"Standard method — see the club's 'Handling' handout.",
  task:"A few seconds a day on each area: ears, mouth, paws, tail, collar, a quick all-over run of the hands. Treat after each one.",
  tips:["Stop before he wants to stop.","This is what makes the vet and groomer easy later."]},

 {t:"Toilet routine",c:"Life skills",w:"At home",s:"Extra · general practice",
  task:"Out after waking, after eating, after play, and every hour or so between. Go with him, stay quiet, and pay him outside the moment he finishes.",
  tips:["Reward outdoors, not back in the kitchen — he needs to know what earned it.","Accidents indoors get cleaned with an enzyme cleaner and no comment."]},

 {t:"Time alone",c:"Life skills",w:"At home",s:"Extra · general practice",
  task:"Leave him settled with something to chew, go out of the room, come back before he is worried. Seconds at first, then minutes.",
  tips:["Come back while he is still calm, so leaving never predicts panic.","Vary it — sometimes you go to the kettle, sometimes to the front door and back."]},

 {t:"Socialisation, little and often",c:"Life skills",w:"Out and about",s:"Extra · general practice",
  task:"New sights and sounds in small doses: traffic, bins, hats, sticks, umbrellas, children at a distance. Let him look, then pay him for looking back at you.",
  tips:["Let him approach in his own time — never lure or carry him into something that worries him.","Watching calmly from a distance counts as a win. Going closer is optional.","Quality over quantity. One good experience beats five overwhelming ones."]},

 {t:"Car travel",c:"Life skills",w:"Out and about",s:"Extra · general practice",
  task:"Feed him in the stationary car with the engine off, then with it running, then a two-minute drive to somewhere good.",
  tips:["If every car trip ends at the vet, the car becomes the vet.","Build up before the first long journey, not during it."]},

 {t:"Collar grab game",c:"Games",w:"At home",s:"Extra · general practice",
  task:"Take hold of his collar, immediately give a treat, let go. Repeat a handful of times a day in different places.",
  tips:["The day you need to grab him in a hurry, the grab should mean food and not trouble.","Pair with the recall: come in, collar hold, treat, release."]},

 {t:"Surfaces and wobbles",c:"Life skills",w:"Anywhere",s:"Extra · general practice",
  task:"Metal grates, gravel, wet grass, a cushion on the floor, a plank on the lawn. Let him work out each one with treats scattered on it.",
  tips:["Confidence with footing now means fewer refusals at vet tables and stairs later."]},

 {t:"Mock vet exam",c:"Handling",w:"At home",s:"Extra · general practice",
  task:"Lift him onto a table or worktop with a towel down, look in his ears, lift a lip, hold a paw, run a hand down his back. Treat throughout, then lift him down.",
  tips:["Thirty seconds is plenty.","Do it when nothing is wrong, so it stays neutral."]},

 {t:"Adding to the bowl",c:"Handling",w:"At home",s:"Extra · general practice",
  task:"While he is eating, walk past and drop something better into the bowl. Never take the bowl away to prove a point.",
  tips:["He should learn that a hand near his food means more food arrives.","If he stiffens or goes quiet over food, stop and ask Rachel rather than pushing on."]},

 {t:"Sleep and the zoomies",c:"Care",w:"At home",s:"Extra · general practice",
  task:"A puppy this age needs a lot of sleep. When he gets frantic, bitey and deaf to cues, try a nap in the crate before you try more training.",
  tips:["Overtired looks exactly like naughty.","Protect the daytime sleep as carefully as you protect the training time."]},

 {t:"Doorways",c:"Manners",w:"At home",s:"Extra · general practice",
  task:"Hand on the door handle: if he sits, the door opens. If he gets up, the door closes. The opening door is the reward.",
  tips:["Works on the back door, the front door, the car boot and the crate.","No cue needed at first — let him work out what opens it."]},

 {t:"Three-second hello",c:"Recall",w:"Out and about",s:"Extra · general practice",
  task:"Let him greet another dog for about three seconds, then call him away and pay well. Greetings stay short and end on your terms.",
  tips:["Long greetings are where most pups tip into rude or overwhelmed.","Calling him out of something good and paying him is the recall practice that matters."]},

 {t:"Proofing in new places",c:"Attention",w:"Out and about",s:"Extra · general practice",
  task:"Everything he knows at home needs teaching again in the garden, on the pavement, and in the car park. Go back to easy steps in each new place.",
  tips:["He isn't being stubborn — dogs don't generalise the way we assume.","Pay better in harder places."]}
];

/* ---------- state ------------------------------------------------------- */
const KEY='cue.v1';
let state={counts:{},today:0,day:new Date().toDateString()};
try{
  const raw=localStorage.getItem(KEY);
  if(raw){const s=JSON.parse(raw);if(s&&typeof s==='object'){state=Object.assign(state,s);}}
}catch(e){}
if(state.day!==new Date().toDateString()){state.day=new Date().toDateString();state.today=0;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

let filter={where:'All',set:'All'};
let bag=[],current=null,listOpen=false;

/* ---------- filters ----------------------------------------------------- */
const FILTERS=[
  {g:'where',v:'All',label:'All cards'},
  {g:'where',v:'At home',label:'At home'},
  {g:'where',v:'Out and about',label:'Out and about'},
  {g:'set',v:'Club',label:'Club only'},
  {g:'set',v:'Extras',label:'Extras only'}
];
const filtersEl=document.getElementById('filters');
FILTERS.forEach(f=>{
  const b=document.createElement('button');
  b.className='chip';b.textContent=f.label;b.setAttribute('aria-pressed','false');
  b.onclick=()=>{
    if(f.g==='where'){filter.where=(filter.where===f.v&&f.v!=='All')?'All':f.v;}
    else{filter.set=(filter.set===f.v)?'All':f.v;}
    refresh();
  };
  f.el=b;filtersEl.appendChild(b);
});
const listBtn=document.createElement('button');
listBtn.className='chip';listBtn.textContent='All exercises';listBtn.setAttribute('aria-pressed','false');
listBtn.onclick=()=>{listOpen=!listOpen;refresh();};
filtersEl.appendChild(listBtn);

function pool(){
  return DECK.filter(c=>{
    const okWhere = filter.where==='All' || c.w===filter.where || c.w==='Anywhere';
    const isExtra = c.s.indexOf('Extra')===0;
    const okSet = filter.set==='All' || (filter.set==='Extras'?isExtra:!isExtra);
    return okWhere && okSet;
  });
}

/* ---------- drawing ----------------------------------------------------- */
function draw(){
  const p=pool();
  if(!p.length){current=null;render();return;}
  bag=bag.filter(c=>p.indexOf(c)>-1);
  if(!bag.length){
    bag=p.slice();
    for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}
    if(bag.length>1&&bag[0]===current)bag.push(bag.shift());
  }
  current=bag.pop();
  cardEl.classList.remove('flipped');
  render();
}

const cardEl=document.getElementById('card');
function tag(text,cls){const s=document.createElement('span');s.className='tag'+(cls?' '+cls:'');s.textContent=text;return s;}

function render(){
  FILTERS.forEach(f=>f.el.setAttribute('aria-pressed',String(filter[f.g]===f.v)));
  listBtn.setAttribute('aria-pressed',String(listOpen));
  document.getElementById('stage').classList.toggle('off',listOpen);
  document.getElementById('bar').classList.toggle('off',listOpen);
  document.getElementById('list').classList.toggle('on',listOpen);

  const total=Object.keys(state.counts).reduce((n,k)=>n+state.counts[k],0);
  document.getElementById('tally').textContent=state.today+' today · '+total+' all time';
  document.getElementById('foot').textContent=pool().length+' cards in this deck. ';

  const fm=document.getElementById('frontMeta'),bm=document.getElementById('backMeta');
  fm.textContent='';bm.textContent='';
  if(!current){
    document.getElementById('frontTitle').textContent='No cards match';
    document.getElementById('task').textContent='Clear a filter to bring cards back.';
    document.getElementById('tips').textContent='';
    document.getElementById('src').textContent='';
    return;
  }
  const c=current;
  const isExtra=c.s.indexOf('Extra')===0;
  [fm,bm].forEach(m=>{
    m.appendChild(tag(c.w,'where'));
    m.appendChild(tag(c.c));
    if(isExtra)m.appendChild(tag('Extra','extra'));
  });
  document.getElementById('frontTitle').textContent=c.t;
  document.getElementById('backTitle').textContent=c.t;
  document.getElementById('task').textContent=c.task;
  const tips=document.getElementById('tips');tips.textContent='';
  (c.tips||[]).forEach(t=>{const li=document.createElement('li');li.textContent=t;tips.appendChild(li);});
  document.getElementById('tipHead').hidden=!(c.tips&&c.tips.length);
  const src=document.getElementById('src');src.textContent='';
  src.appendChild(document.createTextNode(c.s));
  const n=state.counts[c.t]||0;
  if(n)src.appendChild(document.createTextNode(' · practised '+n+(n===1?' time':' times')));
  if(c.check){
    src.appendChild(document.createElement('br'));
    const em=document.createElement('span');em.className='checkme';em.textContent=c.check;
    src.appendChild(em);
  }
  buildList();
}

function buildList(){
  const el=document.getElementById('list');
  if(!listOpen){el.textContent='';return;}
  el.textContent='';
  const groups={};
  pool().forEach(c=>{(groups[c.c]=groups[c.c]||[]).push(c);});
  Object.keys(groups).forEach(g=>{
    const h=document.createElement('div');h.className='group';h.textContent=g;el.appendChild(h);
    groups[g].forEach(c=>{
      const b=document.createElement('button');b.className='row';
      const box=document.createElement('span');
      const strong=document.createElement('b');strong.textContent=c.t;
      const small=document.createElement('small');small.textContent=' '+c.w+' · '+c.s;
      box.appendChild(strong);box.appendChild(document.createElement('br'));box.appendChild(small);
      b.appendChild(box);
      const n=state.counts[c.t]||0;
      const cnt=document.createElement('span');cnt.className='count';cnt.textContent=n?'×'+n:'';
      b.appendChild(cnt);
      b.onclick=()=>{current=c;listOpen=false;cardEl.classList.add('flipped');render();};
      el.appendChild(b);
    });
  });
}

/* ---------- actions ----------------------------------------------------- */
function refresh(){bag=[];draw();}
cardEl.onclick=()=>cardEl.classList.toggle('flipped');
document.getElementById('flip').onclick=()=>cardEl.classList.toggle('flipped');
document.getElementById('skip').onclick=draw;
document.getElementById('done').onclick=()=>{
  if(current){state.counts[current.t]=(state.counts[current.t]||0)+1;state.today++;save();}
  draw();
};
document.getElementById('reset').onclick=()=>{
  state.counts={};state.today=0;save();render();
};
document.addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();cardEl.classList.toggle('flipped');}
  if(e.key==='ArrowRight')draw();
});
let x0=null;
cardEl.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;},{passive:true});
cardEl.addEventListener('touchend',e=>{
  if(x0===null)return;
  const dx=e.changedTouches[0].clientX-x0;x0=null;
  if(Math.abs(dx)>60)draw();
},{passive:true});

/* ---------- installable, single file ------------------------------------ */
/* Icons are baked in as data URIs above; the manifest reuses them so the app
   installs with a real icon on Android and iOS without a second file. */
(function(){
  const links=document.querySelectorAll('link[rel="apple-touch-icon"]');
  const small=links.length?links[0].getAttribute('href'):'';
  const large=(document.querySelector('link[rel="icon"][sizes="512x512"]')||{getAttribute:function(){return small;}}).getAttribute('href');
  const manifest={
    name:'Cue \u2014 puppy training cards',short_name:'Cue',start_url:'.',scope:'.',
    display:'standalone',background_color:'#16211B',theme_color:'#16211B',
    icons:[
      {src:small,sizes:'180x180',type:'image/png',purpose:'any'},
      {src:large,sizes:'512x512',type:'image/png',purpose:'any'},
      {src:large,sizes:'512x512',type:'image/png',purpose:'maskable'}
    ]
  };
  try{
    const link=document.createElement('link');
    link.rel='manifest';
    link.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
    document.head.appendChild(link);
  }catch(e){}
})();

draw();
</script>
</body>
